[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "IMDgroup-pymatgen"
version = "1.2.0"
description = "Pymatgen add-ons and cluster job-submission tools for the Inverse Materials Design group"
authors = [ {name = "Ihor Radchenko", email = "yantar92@posteo.net"},
            {name = "Oleksandr I. Malyi", email = "oleksandrmalyi@gmail.com"} ]
readme = {file = "README.md", content-type = "text/markdown"}
keywords = ["crystal", "materials", "science", "structure", "VASP", "pymatgen", "cluster", "MACE", "slurm", "ase"]
classifiers = [
	    "Development Status :: 4 - Beta",
            "Environment :: Console",
            "License :: OSI Approved :: MIT License",
            "Operating System :: OS Independent",
            "Programming Language :: Python :: 3.12",
            "Programming Language :: Python :: 3.13",
            "Topic :: Scientific/Engineering :: Chemistry",
            "Topic :: Scientific/Engineering :: Information Analysis",
            "Topic :: Scientific/Engineering :: Physics",
            "Topic :: Software Development :: Libraries :: Python Modules",
            "Topic :: System :: Clustering"]
requires-python = ">=3.12, <3.14"
dependencies = [
"numpy>=1.26.4",
"pymatgen",
"alive_progress==3.1.5",
"ase>=3.23.0",
"termcolor",
"pandas",
"python-dateutil",
"scikit-learn",
"networkx",
"cachetools",
"duecredit>=0.11",
"lmdb",
"tomli>=1.1.0; python_version < '3.11'",
"typing-extensions"
]

[project.urls]
homepage = "https://www.oimalyi.org/"

[project.optional-dependencies]
dev = ["pyright"]
test = ["pytest", "pytest-cov"]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "autodocsumm>=0.2",
    "myst-parser>=2.0",
    "sphinxcontrib-mermaid>=0.7",
]

[project.scripts]
pmg-insert-molecule = "IMDgroup.pymatgen.transformations.insert_molecule_cli:main"
imdg = "IMDgroup.pymatgen.cli.imdg:main"
gorun = "IMDgroup.gorun.gorun:main"
gorun-mace = "IMDgroup.gorun.gorun:main_mace"
gorun-mace-finetune = "IMDgroup.gorun.gorun:main_mace"
gorun-atat-local = "IMDgroup.gorun.gorun_atat_local:main"
gorun-maps = "IMDgroup.gorun.gorun_maps:main"

[tool.setuptools]
script-files = ["scripts/gorun-all-ready.sh"]

[tool.setuptools.packages.find]
exclude = ["tests"]
where = ["src/"]
include = [
	"IMDgroup.pymatgen",
	"IMDgroup.pymatgen.*",
        "IMDgroup",
        "IMDgroup.*",
        ]

[tool.setuptools.package-data]
"IMDgroup.pymatgen.io.vasp" = ["*.cif", "*.yaml"]

[tool.pylint]
source-roots=['./src']

[tool.coverage.run]
branch = true
source = ["IMDgroup"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not heavy' --cov=IMDgroup --cov-report=term-missing"
pythonpath = ["src"]
filterwarnings = [
    # Upstream warnings we cannot fix; harmless in tests.
    "ignore:Casting complex values to real discards the imaginary part:numpy.exceptions.ComplexWarning:pymatgen\\.core\\.operations",
    "ignore:No POTCAR file with matching TITEL fields:UserWarning:pymatgen\\.io\\.vasp\\.outputs",
    # No module field on the spglib filter: pytest.warns() re-emits
    # unmatched warnings with module="warnings" (see _pytest/recwarn.py),
    # so a module-scoped filter would miss them.
    "ignore:Set OLD_ERROR_HANDLING to false and catch the errors directly:DeprecationWarning",
    "ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning:ase\\.atoms",
    # Our own warning, expected noise in integration tests: the fake VASP
    # fixture has no vdw_kernel.bindat.
    "ignore:Cannot find vdw_kernel.bindat:UserWarning:IMDgroup\\.gorun\\.cleanVASP",
]
markers = [
    "integration: tests that require generated VASP fixtures (see scripts/prepare_vasp_fixtures.sh)",
    "heavy: slow tests, skipped by default (run with pytest -m heavy)",
]