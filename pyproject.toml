[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "MatRiFFlow"
version = "2.0.0"
description = "Pymatgen add-ons and cluster job-submission tools for the Inverse Materials Design group (formerly IMDgroup-pymatgen)"
authors = [ {name = "Ihor Radchenko", email = "yantar92@posteo.net"},
            {name = "Oleksandr I. Malyi", email = "oleksandrmalyi@gmail.com"} ]
readme = {file = "README.md", content-type = "text/markdown"}
keywords = ["crystal", "materials", "science", "structure", "VASP", "pymatgen", "cluster", "MACE", "slurm", "ase"]
classifiers = [
	    "Development Status :: 4 - Beta",
            "Environment :: Console",
            "License :: OSI Approved :: MIT License",
            "Operating System :: OS Independent",
            "Programming Language :: Python :: 3.12",
            "Programming Language :: Python :: 3.13",
            "Topic :: Scientific/Engineering :: Chemistry",
            "Topic :: Scientific/Engineering :: Information Analysis",
            "Topic :: Scientific/Engineering :: Physics",
            "Topic :: Software Development :: Libraries :: Python Modules",
            "Topic :: System :: Clustering"]
requires-python = ">=3.12, <3.14"
dependencies = [
"numpy>=1.26.4",
"pymatgen",
"alive_progress==3.1.5",
"ase>=3.23.0",
"termcolor",
"rich",
"pandas",
"python-dateutil",
"pytimeparse",
"scikit-learn",
"networkx",
"cachetools",
"duecredit>=0.11",
"lmdb",
"typing-extensions"
]

[project.urls]
homepage = "https://www.oimalyi.org/"

[project.optional-dependencies]
dev = ["pyright"]
test = ["pytest", "pytest-cov"]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "autodocsumm>=0.2",
    "myst-parser>=2.0",
    "sphinxcontrib-mermaid>=0.7",
]
mace = [
    "mace-torch",
    "torch",
]

[project.scripts]
mrf = "matrifflow.pymatgen.cli.mrf:main"
imdg = "matrifflow.pymatgen.cli.mrf:main_deprecated_imdg"
gorun = "matrifflow.gorun.gorun:main"
gorun-mace = "matrifflow.gorun.gorun:main_mace"
gorun-mace-finetune = "matrifflow.gorun.gorun:main_mace"
gorun-atat-local = "matrifflow.gorun.gorun_atat_local:main"
gorun-maps = "matrifflow.gorun.gorun_maps:main"

[tool.setuptools]
script-files = ["scripts/gorun-all-ready.sh"]

[tool.setuptools.packages.find]
exclude = ["tests"]
where = ["src/"]
include = [
	"matrifflow.pymatgen",
	"matrifflow.pymatgen.*",
        "matrifflow",
        "matrifflow.*",
        "IMDgroup",
        "IMDgroup.*",
        ]

[tool.setuptools.package-data]
"matrifflow.pymatgen.io.vasp" = ["*.cif", "*.yaml"]
"matrifflow.gorun" = ["data/*.toml"]

[tool.pylint]
source-roots=['./src']

[tool.pyright]
include = ["src"]
exclude = ["**/__pycache__", "build", "**/.mypy_cache"]
typeCheckingMode = "strict"
pythonPlatform = "Linux"

[tool.coverage.run]
branch = true
source = ["matrifflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not heavy' --cov=matrifflow --cov-report=term-missing"
pythonpath = ["src"]
filterwarnings = [
    # Upstream warnings we cannot fix; harmless in tests.
    "ignore:Casting complex values to real discards the imaginary part:numpy.exceptions.ComplexWarning:pymatgen\\.core\\.operations",
    # No module field on the next two filters.  pytest.warns() re-emits
    # every warning it did not match itself with module="warnings" (see
    # _pytest/recwarn.py), so a module-scoped filter never matches a
    # warning raised inside a pytest.warns() block.  The POTCAR warning is
    # also raised with stacklevel=2, which reports the caller's module
    # instead of pymatgen.io.vasp.outputs.
    "ignore:No POTCAR file with matching TITEL fields:UserWarning",
    "ignore:Set OLD_ERROR_HANDLING to false and catch the errors directly:DeprecationWarning",
    # Emitted outside pytest.warns() blocks, so these stay module-scoped.
    "ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning:ase\\.atoms",
    # Our own warning, expected noise in integration tests: the fake VASP
    # fixture has no vdw_kernel.bindat.
    "ignore:Cannot find vdw_kernel.bindat:UserWarning:matrifflow\\.gorun\\.cleanVASP",
]
markers = [
    "integration: tests that require generated VASP fixtures (see scripts/prepare_vasp_fixtures.sh)",
    "heavy: slow tests, skipped by default (run with pytest -m heavy)",
]