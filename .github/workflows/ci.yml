name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install project and test dependencies
        # Docs dependencies are needed so that tests/test_docs.py can run
        # instead of skipping.
        run: pip install -e ".[test,docs]"

      - name: Run tests
        run: pytest
